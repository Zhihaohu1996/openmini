<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-qDoWMWIkHxNeKjGkB1Wu+TncdfFIlLoueXJYRKEVuXo='; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; script-src-attr 'none'">
<title>hello-remote</title>
</head>
<body>
<h1 id="status">loading...</h1>
<script>(function () {
  var CHANNEL = 'openmini';
  var VERSION = 1;

  function isEnvelope(data) {
    return (
      data !== null &&
      typeof data === 'object' &&
      data.channel === CHANNEL &&
      data.version === VERSION &&
      typeof data.sessionId === 'string' &&
      data.sessionId.length > 0 &&
      (data.type === 'handshake-init' || data.type === 'handshake-ack')
    );
  }

  function onBootstrap(event) {
    if (event.source !== window.parent) {
      return;
    }
    if (!event.ports || event.ports.length !== 1) {
      return;
    }
    if (!isEnvelope(event.data) || event.data.type !== 'handshake-init') {
      return;
    }

    window.removeEventListener('message', onBootstrap);
    var port = event.ports[0];
    port.postMessage({
      channel: CHANNEL,
      version: VERSION,
      sessionId: event.data.sessionId,
      type: 'handshake-ack',
    });
  }

  window.addEventListener('message', onBootstrap);

  var statusEl = document.getElementById('status');
  statusEl.textContent = 'loaded from remote package';
})();</script>
</body>
</html>
